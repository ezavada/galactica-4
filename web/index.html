<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galactica-4</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #02020d; }
    #pdg-canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #d8d8dc; font: 15px system-ui, sans-serif; pointer-events: none;
      background: radial-gradient(circle at center, rgba(40, 40, 52, 0.45), rgba(2, 2, 13, 0.92));
    }
  </style>
</head>
<body>
  <canvas id="pdg-canvas" width="800" height="600" tabindex="0"></canvas>
  <div id="status">Loading Galactica-4…</div>
  <script>
    window.Module = { canvas: document.getElementById('pdg-canvas') };
  </script>
  <script src="galactica-assets.js"></script>
  <script src="galactica-web.js"></script>
</body>
</html>
